; =============================================================================
; Limites de upload do PHP
; =============================================================================
; O painel já declara os tetos dele em inc/config.php (8 MB por foto, 128 MB por
; vídeo), mas quem manda de verdade é o MENOR entre o nosso número e o do
; servidor. Sem este arquivo, a hospedagem compartilhada entrega
; upload_max_filesize = 2M, e a aba Imagens anunciava "até 2 MB cada" por mais
; que a constante dissesse 8: o painel mostra o limite real, de propósito, para
; a cliente não tentar de novo e de novo um envio que nunca ia passar.
;
; post_max_size fica acima do maior arquivo porque ele mede o corpo INTEIRO do
; envio, não cada arquivo: várias fotos numa tacada só somam.
;
; Por que .user.ini e não php_value no .htaccess: a HostGator roda PHP como
; FastCGI, e php_value nessa configuração devolve 500 na página inteira. O
; .user.ini é lido pelo próprio PHP e, onde não for suportado, é simplesmente
; ignorado, sem derrubar nada.
;
; ATENÇÃO: o servidor da HostGator ainda pode ter um teto próprio acima deste
; arquivo. Se a aba Imagens continuar anunciando menos de 8 MB depois do deploy,
; o valor precisa ser levantado no cPanel, em MultiPHP INI Editor.
;
; O servidor embutido do PHP (php -S, o do desenvolvimento) NÃO lê .user.ini.
; Por isso o comando de desenvolvimento passa os mesmos valores com -d. Ver
; README e CLAUDE.md.

upload_max_filesize = 128M
post_max_size = 136M
