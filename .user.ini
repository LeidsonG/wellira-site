; =============================================================================
; Limites de upload do PHP
; =============================================================================
; O painel já declara os tetos dele em inc/config.php (8 MB por foto, 128 MB
; por vídeo), mas quem manda de verdade é o MENOR entre o nosso número e o do
; servidor. Sem este arquivo, a hospedagem compartilhada entrega 2M.
;
; post_max_size fica acima do maior arquivo porque mede o corpo INTEIRO do
; envio, e não cada arquivo isoladamente.
;
; .user.ini, e não php_value no .htaccess: a hospedagem roda PHP como FastCGI,
; onde php_value derruba a página inteira com 500.
;
; O servidor embutido do PHP (php -S, desenvolvimento) não lê este arquivo;
; o comando de desenvolvimento passa os mesmos valores com -d. Ver README.

upload_max_filesize = 128M
post_max_size = 136M
